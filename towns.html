<!DOCTYPE html>
<html>

<head>
    <title>Towns</title>
	<link rel="stylesheet" href="towns.css" />
    <script src="https://code.jquery.com/jquery-3.1.1.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jqueryui/1.13.2/jquery-ui.min.js"></script>
    <script src="towns.js"></script>
</head>

<body>

<article>
    <header><h1>Towns</h1></header>
    <select id="towns" size="4">
        <option>Sofia</option>
        <option>Plovdiv</option>
        <option>Varna</option>
        <option>Bourgas</option>
    </select>
</article>

<article>
    <header><h1>Delete Existing Town</h1></header>
    <input type="text" id="townName" />
    <button id="btnDelete">Delete</button>
</article>

<article>
    <header><h1>Add New Town</h1></header>
    <input type="text" id="townNameForAdd" />
    <button id="btnAdd">Add</button>
</article>

<article>
    <header><h1>Shuffle Towns</h1></header>
    <button id="btnShuffle">Shuffle</button>
</article>

<div id="result"></div>

</body>

</html>
